apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-p3
  namespace: argocd
spec:
  project: default #can be seen as a security groups, using default profile
  source:
    repoURL: 'https://github.com/ndelh/iotp3'
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: dev
  syncPolicy:
    automated:
      prune: true #allow suppresion in cluster following git instruction
      selfHeal: true # drift correction
