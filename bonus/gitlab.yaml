# gitlab.yaml : GitLab CE (omnibus image, everything in one pod) in namespace gitlab
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path # provided by k3d/k3s
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume, never two pods at once
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:18.4.1-ce.0
          ports:
            - containerPort: 80
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-root-password
                  key: password
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://localhost:8082'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
                gitlab_rails['usage_ping_enabled'] = false
                # keep it light
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 10
                prometheus_monitoring['enable'] = false
                gitlab_kas['enable'] = false
                registry['enable'] = false
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /users/sign_in
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /etc/gitlab
              subPath: config
            - name: data
              mountPath: /var/opt/gitlab
              subPath: data
            - name: data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
# reachable inside the cluster as http://gitlab.gitlab.svc.cluster.local
# and from the host as http://localhost:8082 (k3d maps 8082 -> 30082)
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
