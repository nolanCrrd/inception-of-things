apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-bonus
  namespace: argocd
spec:
  project: default #can be seen as a security groups, using default profile
  source:
    repoURL: 'http://gitlab.gitlab.svc.cluster.local/root/iot-app.git' # local gitlab, in-cluster url
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true #allow suppresion in cluster following git instruction
      selfHeal: true # drift correction
