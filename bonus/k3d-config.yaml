# k3d-config.yaml
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: iot-bonus
servers: 1
agents: 1
ports:
  - port: 8080:30080 #argo cd web ui
    nodeFilters:
      - agent:0
  - port: 8081:30081 #will app
    nodeFilters:
      - agent:0
  - port: 8082:30082 #gitlab web ui + git over http
    nodeFilters:
      - agent:0
